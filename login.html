<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Hub | Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="login-container">

    <div class="login-left">

        <h1>Student Hub</h1>

        <h2>Welcome Back!</h2>

        <p>
            Login to access your courses, assignments,
            timetable, notices and student profile.
        </p>

        <img src="../images/login.png" alt="Student Login">

    </div>


    <div class="login-right">

        <form class="login-form" id="loginForm" action="dashboard.html">

            <h2>Login</h2>


            <div class="input-box">

                <label>Email</label>

                <input type="email" id="username" placeholder="Enter your email">

            </div>


            <div class="input-box">

                <label>Password</label>

                <input type="password" id="password" placeholder="Enter your password">

            </div>


            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>


            <p class="register-text">

                Don't have an account?
            <a href="registration.html">Register</a>

            </p>


            <hr>


            <div class="social-login">

                <button type="button" class="google-btn">

                    <i class="fa-brands fa-google"></i>

                    Google

                </button>


                <button type="button" class="facebook-btn">

                    <i class="fa-brands fa-facebook-f"></i>

                    Facebook

                </button>

            </div>


            <br>


            <a href="index.html" class="back-home">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </form>

    </div>

</div>


<script src="../js/javascript.js"></script>

</body>

</html>
